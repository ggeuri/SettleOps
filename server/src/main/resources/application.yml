spring:
  profiles:
    default: local

  jackson:
    time-zone: Asia/Seoul

  jpa:
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  output:
    ansi:
      enabled: always   # 콘솔 ANSI 색상 강제 활성화

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: info
  pattern:
    # [%X{request_id}]
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr([%thread]){magenta} %highlight(%-5level) %clr([%X{request_id}]){cyan} %clr(%logger{36}){yellow} - %msg%n"