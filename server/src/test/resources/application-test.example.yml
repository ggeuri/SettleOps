spring:
  sql:
    init:
      mode: never   # ✅ schema-test.sql 실행 완전 중단

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/test-migration
    # clean 금지 권장(실수 방지)
    clean-disabled: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace